<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		  content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Canvas Jelly</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<style>
		html {
			background: #000;
			color: #fff;
			font-family: "Roboto", "Helvetica Neue", sans-serif;
		}

		body {
			display: flex;
			min-height: 100vh;
			margin: 0;
			justify-content: space-around;
			align-items: center;
		}

		#canvas-section {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		canvas {
			display: block;
			max-width: 100vw;
			max-height: 80vh;
			width: auto;
			height: auto;
			cursor: crosshair;
		}

		#bounce-counter {
			font-size: 0.9rem;
			opacity: 0.7;
			letter-spacing: 0.05em;
		}
	</style>
</head>
<body>
<section id="canvas-section">
	<h1>Canvas Jelly</h1>
	<div class="canvas-container">
		<canvas width="1280" height="720" id="my-canvas"></canvas>
	</div>
	<p id="bounce-counter">Bounces: 0</p>
	<p id="high-score">Best: 0</p>
	<p id="speed-stat">Speed: 85 px/s</p>
	<p id="top-speed">Top speed: 0 px/s</p>
	<button id="reset-btn" title="Reset (R)">Reset</button>
	<button id="pause-btn" title="Pause (Space)">Pause</button>
	<button id="sound-btn" title="Mute (M)">Sound: On</button>
	<button id="boost-btn" title="Boost (B)">Boost</button>
</section>

<script>
	const canvas = document.querySelector("#my-canvas");
	const ctx = canvas.getContext("2d")


	const clear = () => {
		// Fading to translucent black (not the jelly's own color) leaves a motion
		// trail without washing the background toward the jelly's color, which
		// used to make the jelly blend in and disappear over time.
		ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
		ctx.fillRect(0, 0, canvas.width, canvas.height);
	}

	const jelly = {
		x: Math.floor(canvas.width / 2),
		y: Math.floor(canvas.height / 2),
		w: 20,
		h: 20,
		velX: 60, // px per second
		velY: 60, // px per second
		color: "#fff",
		scaleX: 1,
		scaleY: 1
	}
	const maxSpeed = 240; // px per second, shared cap for bounce speedup and boosts

	const randomColor = () => `hsl(${Math.floor(Math.random() * 360)}, 90%, 65%)`;

	let soundOn = true;
	let audioCtx = null;
	const unlockAudio = () => {
		if (!audioCtx) {
			audioCtx = new (window.AudioContext || window.webkitAudioContext)();
		} else if (audioCtx.state === "suspended") {
			audioCtx.resume();
		}
	};
	// Not `{ once: true }`: the context can be suspended again later (e.g. tab
	// loses focus), so every pointerdown must be able to resume it.
	document.addEventListener("pointerdown", unlockAudio);
	const playBounceSound = () => {
		if (!soundOn || !audioCtx) return;
		const osc = audioCtx.createOscillator();
		const gain = audioCtx.createGain();
		osc.type = "sine";
		osc.frequency.value = 220 + Math.random() * 220;
		gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
		gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
		osc.connect(gain).connect(audioCtx.destination);
		osc.start();
		osc.stop(audioCtx.currentTime + 0.15);
	};
	const soundBtn = document.querySelector("#sound-btn");
	soundBtn.addEventListener("click", () => {
		soundOn = !soundOn;
		soundBtn.textContent = soundOn ? "Sound: On" : "Sound: Off";
	});

	const boostBtn = document.querySelector("#boost-btn");
	boostBtn.addEventListener("click", () => {
		// Kick the jelly off in a random direction at 1.5x its current speed, so
		// boosting is a deliberate risk/reward move rather than a guaranteed max-speed jump.
		const speed = Math.min(Math.hypot(jelly.velX, jelly.velY) * 1.5, maxSpeed);
		const angle = Math.random() * Math.PI * 2;
		jelly.velX = Math.cos(angle) * speed;
		jelly.velY = Math.sin(angle) * speed;
		jelly.color = randomColor();
		updateSpeedStat();
	});

	// Click the canvas to steer the jelly toward that point without changing its speed.
	canvas.addEventListener("click", (e) => {
		const rect = canvas.getBoundingClientRect();
		const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
		const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
		const cx = jelly.x + jelly.w / 2;
		const cy = jelly.y + jelly.h / 2;
		const angle = Math.atan2(clickY - cy, clickX - cx);
		const speed = Math.hypot(jelly.velX, jelly.velY);
		jelly.velX = Math.cos(angle) * speed;
		jelly.velY = Math.sin(angle) * speed;
	});

	const bounceCounter = document.querySelector("#bounce-counter");
	const highScoreEl = document.querySelector("#high-score");
	const speedStatEl = document.querySelector("#speed-stat");
	const topSpeedEl = document.querySelector("#top-speed");
	let topSpeed = Number(localStorage.getItem("jelly-top-speed")) || 0;
	topSpeedEl.textContent = `Top speed: ${topSpeed} px/s`;
	const updateSpeedStat = () => {
		const speed = Math.round(Math.hypot(jelly.velX, jelly.velY));
		speedStatEl.textContent = `Speed: ${speed} px/s`;
		if (speed > topSpeed) {
			topSpeed = speed;
			localStorage.setItem("jelly-top-speed", topSpeed);
			topSpeedEl.textContent = `Top speed: ${topSpeed} px/s`;
		}
	}
	let particles = [];
	const spawnParticles = (x, y, color) => {
		for (let i = 0; i < 10; i++) {
			const angle = Math.random() * Math.PI * 2;
			const speed = 40 + Math.random() * 80;
			particles.push({
				x, y,
				vx: Math.cos(angle) * speed,
				vy: Math.sin(angle) * speed,
				life: 0.5,
				maxLife: 0.5,
				color
			});
		}
	};
	const updateParticles = (dt) => {
		for (const p of particles) {
			p.x += p.vx * dt;
			p.y += p.vy * dt;
			p.life -= dt;
		}
		particles = particles.filter(p => p.life > 0);
	};
	const drawParticles = () => {
		for (const p of particles) {
			ctx.save();
			ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
			ctx.fillStyle = p.color;
			ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
			ctx.restore();
		}
	};

	let bounces = 0;
	let highScore = Number(localStorage.getItem("jelly-high-score")) || 0;
	highScoreEl.textContent = `Best: ${highScore}`;
	const registerBounce = () => {
		bounces++;
		bounceCounter.textContent = `Bounces: ${bounces}`;
		if (bounces > highScore) {
			highScore = bounces;
			localStorage.setItem("jelly-high-score", highScore);
			highScoreEl.textContent = `Best: ${highScore}`;
		}
	}

	const updateJelly = (dt) => {
		jelly.x += jelly.velX * dt;
		jelly.y += jelly.velY * dt;
		const maxX = canvas.width - jelly.w;
		const maxY = canvas.height - jelly.h;
		let bouncedX = false;
		let bouncedY = false;
		if (jelly.x >= maxX){
			jelly.x = maxX;
			jelly.velX = -Math.abs(jelly.velX);
			bouncedX = true;
		}
		if (jelly.y >= maxY){
			jelly.y = maxY;
			jelly.velY = -Math.abs(jelly.velY);
			bouncedY = true;
		}
		if (jelly.x <= 0){
			jelly.x = 0;
			jelly.velX = Math.abs(jelly.velX);
			bouncedX = true;
		}
		if (jelly.y <= 0){
			jelly.y = 0;
			jelly.velY = Math.abs(jelly.velY);
			bouncedY = true;
		}
		// Corner hits trigger two wall checks in the same frame; only count it as one bounce.
		if (bouncedX || bouncedY) {
			jelly.color = randomColor();
			registerBounce();
			playBounceSound();
			spawnParticles(jelly.x + jelly.w / 2, jelly.y + jelly.h / 2, jelly.color);
			// Squash along the axis of impact and stretch the other, like real jelly.
			if (bouncedX && bouncedY) {
				jelly.scaleX = 0.7;
				jelly.scaleY = 0.7;
			} else if (bouncedX) {
				jelly.scaleX = 0.55;
				jelly.scaleY = 1.35;
			} else {
				jelly.scaleX = 1.35;
				jelly.scaleY = 0.55;
			}
			// Speed up slightly on each bounce for rising difficulty, capped so it stays playable.
			// Cap the resultant vector's magnitude, not each axis separately, otherwise a
			// diagonal bounce lets combined speed exceed maxSpeed by up to sqrt(2)x.
			const speedUp = 1.03;
			jelly.velX *= speedUp;
			jelly.velY *= speedUp;
			const resultSpeed = Math.hypot(jelly.velX, jelly.velY);
			if (resultSpeed > maxSpeed) {
				const scale = maxSpeed / resultSpeed;
				jelly.velX *= scale;
				jelly.velY *= scale;
			}
			updateSpeedStat();
		}
		// Ease the squash/stretch back to normal every frame, not just on bounce.
		const ease = 1 - Math.pow(0.001, dt);
		jelly.scaleX += (1 - jelly.scaleX) * ease;
		jelly.scaleY += (1 - jelly.scaleY) * ease;
	}
	const drawJelly = () => {
		const cx = jelly.x + jelly.w / 2;
		const cy = jelly.y + jelly.h / 2;
		ctx.save();
		ctx.translate(cx, cy);
		ctx.scale(jelly.scaleX, jelly.scaleY);
		ctx.fillStyle = jelly.color;
		ctx.shadowColor = jelly.color;
		ctx.shadowBlur = 20;
		ctx.fillRect(-jelly.w / 2, -jelly.h / 2, jelly.w, jelly.h);
		ctx.restore();
		drawParticles();
	}

	const resetBtn = document.querySelector("#reset-btn");
	resetBtn.addEventListener("click", () => {
		jelly.x = Math.floor(canvas.width / 2);
		jelly.y = Math.floor(canvas.height / 2);
		jelly.velX = 60;
		jelly.velY = 60;
		jelly.color = "#fff";
		jelly.scaleX = 1;
		jelly.scaleY = 1;
		particles = [];
		bounces = 0;
		bounceCounter.textContent = `Bounces: ${bounces}`;
		updateSpeedStat();
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		drawJelly();
		// Resetting while paused wiped the overlay text; redraw it so the UI stays consistent.
		if (paused) drawPauseOverlay();
	});

	const drawPauseOverlay = () => {
		ctx.save();
		ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
		ctx.font = "bold 48px 'Roboto', sans-serif";
		ctx.textAlign = "center";
		ctx.textBaseline = "middle";
		ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
		ctx.restore();
	}

	let paused = false;
	const pauseBtn = document.querySelector("#pause-btn");
	const togglePause = () => {
		paused = !paused;
		pauseBtn.textContent = paused ? "Resume" : "Pause";
		// Give visual feedback on the canvas itself, not just the button label
		if (paused) drawPauseOverlay();
	};
	pauseBtn.addEventListener("click", togglePause);
	window.addEventListener("keydown", (e) => {
		if (e.code === "Space") {
			e.preventDefault();
			togglePause();
		} else if (e.code === "KeyR") {
			resetBtn.click();
		} else if (e.code === "KeyB") {
			boostBtn.click();
		} else if (e.code === "KeyM") {
			soundBtn.click();
		}
	});

	let tick = 0;
	let lastTime = null;
	const updateFrame = () => {
		++tick;
		window.requestAnimationFrame((now) => {
			// Cap dt so returning from a background tab doesn't teleport the jelly
			const dt = lastTime === null ? 0 : Math.min((now - lastTime) / 1000, 0.1);
			lastTime = now;
			if (!paused) {
				clear();
				updateJelly(dt);
				updateParticles(dt);
				drawJelly();
			}
			updateFrame();
		});
	}
	updateFrame();
</script>
</body>
</html>
